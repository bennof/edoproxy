name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      latest: ${{ steps.metadata.outputs.latest }}
    steps:
      - uses: actions/checkout@v6
      - id: metadata
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_metadata.py

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: edoproxy
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: edoproxy.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: edoproxy
    runs-on: ${{ matrix.os }}
    env:
      # Make the Windows executable independent of a separately installed VC runtime.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary and license
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('test-{0}-{1}', github.run_id, github.run_attempt) }}
          BUILD_TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p staging dist
          cp "target/$BUILD_TARGET/release/$BINARY" LICENSE README.md edoproxy.example.toml staging/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "dist/edoproxy-$RELEASE_TAG-$BUILD_TARGET.zip" ./staging/*
          else
            tar -czf "dist/edoproxy-$RELEASE_TAG-$BUILD_TARGET.tar.gz" -C staging .
          fi
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        env:
          BUILD_LABEL: ${{ github.event_name == 'push' && github.ref_name || format('test-{0}-{1}', github.run_id, github.run_attempt) }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/build_dmg.py --binary "target/$BUILD_TARGET/release/edoproxy" --output "dist/edoproxy-$BUILD_LABEL-$BUILD_TARGET.dmg"
      - name: Build Windows MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_LABEL: ${{ github.event_name == 'push' && github.ref_name || format('test-{0}-{1}', github.run_id, github.run_attempt) }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          ./scripts/build_msix.ps1 -Binary "target/$env:BUILD_TARGET/release/edoproxy.exe" -Output "dist/edoproxy-$env:BUILD_LABEL-$env:BUILD_TARGET.msix" -TestSign
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG" "--latest=$LATEST")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
